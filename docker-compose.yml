services:
  postgres:
    image: postgres:16-alpine
    container_name: analyseia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analyseia}
      POSTGRES_USER: ${POSTGRES_USER:-analyseia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analyseia}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analyseia} -d ${POSTGRES_DB:-analyseia}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: analyseia-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: analyseia-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analyseia-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://analyseia:analyseia@postgres:5432/analyseia}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me}
      ENVIRONMENT: development
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analyseia-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://analyseia:analyseia@postgres:5432/analyseia}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me}
      ENVIRONMENT: development
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_REQUIRED: ${OLLAMA_REQUIRED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OPS_API_TOKEN: ${OPS_API_TOKEN:-ops-dev-token}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      MPLCONFIGDIR: /tmp/matplotlib
    command: ["uvicorn", "backend.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analyseia-worker
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://analyseia:analyseia@postgres:5432/analyseia}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me}
      ENVIRONMENT: development
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_REQUIRED: ${OLLAMA_REQUIRED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      MPLCONFIGDIR: /tmp/matplotlib
    command:
      [
        "celery",
        "-A",
        "backend.api.celery.worker",
        "worker",
        "--loglevel=info",
        "-Q",
        "analysis,rag,agent",
        "--concurrency=1"
      ]
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: analyseia-frontend
    depends_on:
      backend:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NODE_ENV: development
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  uploads_data:
